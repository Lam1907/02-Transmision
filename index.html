<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Danzad Malditos — Transmisión en Vivo">
  <title>Danzad Malditos · Broadcast</title>
  <link rel="stylesheet" href="broadcast.css">
</head>
<body>

<!-- Cinematic scan line -->
<div class="scanline"></div>

<!-- ═══ APP SHELL ═══ -->
<div id="app">

  <!-- ────────────────────────────────────────────
       SCREEN 1 — WAITING
  ──────────────────────────────────────────── -->
  <section id="screen-waiting" class="screen" aria-label="Esperando inicio">
    <div class="bg-gradient"></div>

    <div class="brand">RL <span>·</span> Danzad Malditos</div>

    <div id="waiting-grid" class="waiting-grid" role="list"></div>

    <div class="waiting-label">Esperando inicio de votación</div>
  </section>

  <!-- ────────────────────────────────────────────
       SCREEN 2 — VOTING
  ──────────────────────────────────────────── -->
  <section id="screen-voting" class="screen" aria-label="Votación en curso">
    <div class="bg-gradient"></div>

    <div class="brand">RL <span>·</span> Danzad Malditos</div>

    <div class="voting-header">
      <div class="voting-label">Votación en curso</div>
      <div class="voting-round">
        Ronda <span id="voting-round-num">1</span>
      </div>
    </div>

    <!-- Timer ring -->
    <div class="timer-container">
      <div class="timer-ring" role="timer" aria-live="polite">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <circle class="timer-ring-bg" cx="60" cy="60" r="54"/>
          <circle
            id="timer-progress"
            class="timer-ring-progress"
            cx="60" cy="60" r="54"
            stroke-dasharray="339.29"
            stroke-dashoffset="0"
          />
        </svg>
        <div id="timer-value" class="timer-value">00:00</div>
      </div>
      <div class="timer-unit">tiempo restante</div>
    </div>

    <!-- Participants chips -->
    <div id="voting-chips" class="voting-participants" role="list"></div>
  </section>

  <!-- ────────────────────────────────────────────
       SCREEN 3 — CONSOLIDATION
  ──────────────────────────────────────────── -->
  <section id="screen-consolidation" class="screen" aria-label="Consolidando resultados">
    <div class="consolidation-bg"></div>

    <div class="brand">RL <span>·</span> Danzad Malditos</div>

    <!-- Main title (shown first) -->
    <div class="consolidation-text" id="consolidation-title-wrap">
      <div class="consolidation-eyebrow">Resultados</div>
      <div class="consolidation-title">Consolidando</div>
      <div class="consolidation-line"></div>
    </div>

    <!-- Pair reveal (shown sequentially) -->
    <div id="pair-reveal" class="pair-reveal" style="display:none" aria-live="polite"></div>
  </section>

  <!-- ────────────────────────────────────────────
       SCREEN 4 — PAIRS
  ──────────────────────────────────────────── -->
  <section id="screen-pairs" class="screen" aria-label="Parejas consolidadas">
    <div class="bg-gradient"></div>

    <div class="brand">RL <span>·</span> Danzad Malditos</div>

    <div class="pairs-header">
      <div class="pairs-eyebrow">Parejas de la ronda</div>
      <div class="pairs-title">Las Parejas</div>
    </div>

    <div id="pairs-grid" class="pairs-grid" role="list"></div>
  </section>

  <!-- ────────────────────────────────────────────
       SCREEN 5 — WINNER
  ──────────────────────────────────────────── -->
  <section id="screen-winner" class="screen" aria-label="Ganadores">
    <div class="winner-bg"></div>
    <div id="winner-particles" class="winner-particles"></div>

    <div class="brand">RL <span>·</span> Danzad Malditos</div>

    <div class="winner-eyebrow">Y los ganadores son</div>
    <div class="winner-title">Ganadores</div>

    <div id="winner-cards" class="winner-cards" role="region" aria-live="polite"></div>
  </section>

</div><!-- /#app -->

<!-- ────────────────────────────────────────────
     ELIMINATION OVERLAY (global, above all)
──────────────────────────────────────────── -->
<div id="overlay-elimination" role="alert" aria-live="assertive"></div>

<!-- Connection badge -->
<div class="connection-badge" aria-live="polite">
  <div id="conn-dot" class="connection-dot"></div>
  <span id="conn-label">Conectando</span>
</div>

<!-- ─── Firebase + Broadcast Module ─── -->
<script type="module" src="broadcast.js"></script>

</body>
</html>
